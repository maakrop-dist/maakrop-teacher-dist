name: Sync Upstream Maakrop Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest Maakrop Teacher Edition release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/maakrop-dist/maakrop-teacher-dist.git || true
          git fetch upstream main
          git merge --ff-only upstream/main || git merge upstream/main --no-edit -X theirs
          git push origin main
